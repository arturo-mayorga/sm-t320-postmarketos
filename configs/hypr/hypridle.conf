# Idle management for the tablet. The panel is never DPMS-cycled (it goes
# dark after a few cycles, see bin/tab-screen); idle = backlight off.
general {
    lock_cmd = pidof hyprlock || hyprlock
}
listener {
    timeout = 180
    on-timeout = ~/.local/bin/tab-screen off
    on-resume = ~/.local/bin/tab-screen on
}
