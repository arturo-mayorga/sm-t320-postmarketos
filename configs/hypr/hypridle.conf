# Idle management for the tablet: dim/blank the panel, then suspend.
# Suspend needs the kernel's suspend-to-RAM to be verified first (next session).
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = hyprctl dispatch dpms off
    after_sleep_cmd = hyprctl dispatch dpms on
}
listener {
    timeout = 180
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
listener {
    timeout = 600
    # on-timeout = sudo -n zzz   # disabled: display stays black after resume
}
