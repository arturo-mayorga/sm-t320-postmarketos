# Minimal render path. The Adreno 330 runs without an IOMMU on a VRAM
# carveout, which upstream flags as unprotected; heavy render passes lock
# the GPU up (hangcheck, GL_GUILTY_CONTEXT_RESET). Keep it to plain quads.
monitor = DSI-1, preferred, 0x0, 2, transform, 3

source = ~/.config/hypr/bindings.conf

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
    active_opacity = 1.0
    inactive_opacity = 1.0
}

animations { enabled = false }

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

debug {
    disable_logs = false
}


exec-once = swaybg -c 1e1e2e
exec-once = waybar
exec-once = mako


# Touch: bind explicitly; the automatic bind runs before the monitor exists.
device {
    name = synaptics-s5707
    output = DSI-1
    transform = 3
}

# On-screen keyboard: starts hidden; SIGRTMIN toggles it (Super+Alt+K or the bar button)
exec-once = wvkbd-mobintl --hidden -L 260
