# Minimal render path. The Adreno 330 runs without an IOMMU on a VRAM
# carveout, which upstream flags as unprotected; heavy render passes lock
# the GPU up (hangcheck, GL_GUILTY_CONTEXT_RESET). Keep it to plain quads.
monitor = DSI-1, preferred, 0x0, 2, transform, 3

source = ~/.config/hypr/bindings.conf

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    # Catppuccin accent / muted, as on the laptop
    col.active_border = rgb(89b4fa)
    col.inactive_border = rgb(585b70)
}
group {
    col.border_active = rgb(89b4fa)
    col.border_inactive = rgb(585b70)
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
    active_opacity = 1.0
    inactive_opacity = 1.0
}

animations { enabled = false }

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

debug {
    disable_logs = false
}


exec-once = swaybg -i ~/.config/backgrounds/rainbow-2560x1600.jpg -m fill
exec-once = waybar
exec-once = mako


# Touch: bind explicitly; the automatic bind runs before the monitor exists.
device {
    name = synaptics-s5707
    output = DSI-1
    transform = 3
}

# On-screen keyboard: starts hidden; SIGRTMIN toggles it (Super+Alt+K or the bar button)
exec-once = wvkbd-mobintl --hidden -L 260

# Hardware TUIs (bluetui / nmtui / pulsemixer) float in the middle of the screen
windowrule {
    name = tab-hw-float
    match:initial_title = ^(tab-hw-.*)$
    float = true
    size = 900 600
    center = true
}

# Audio session (pipewire runs per user, started with the desktop)
exec-once = pipewire
exec-once = wireplumber
exec-once = pipewire-pulse

# Screen rotation from the accelerometer (needs the MPU-6515 DT node + iio-sensor-proxy)
exec-once = ~/.local/bin/tab-autorotate

# No hyprland-guiutils on armv7 (only hyprland-qt-support is packaged), so
# avoid every path that would pop a dialog: no update/donation notices, and
# pre-granted screen capture for the tools we use.
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
permission = /usr/bin/grim, screencopy, allow
permission = /usr/bin/hyprpicker, screencopy, allow

# Idle: panel off after 3 min, suspend after 10 (see hypridle.conf)
exec-once = hypridle
